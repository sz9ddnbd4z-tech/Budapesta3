name: UX memory and reset cleanup
on:
  push:
    paths:
      - '.github/workflows/ux-memory-reset.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch story and reset UX
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('story.js')
          s=p.read_text()

          # Make history panel explicitly closable.
          old="host.innerHTML='<details id=\"history-details\" '+(historyOpen?'open':'')+'><summary>❤️ Wasze ślady <span id=\"clue-count\"></span></summary><div class=\"history-body\"><p>Odkryte wspomnienia zapisują się na tym urządzeniu.</p><div id=\"clue-fields\"></div><p id=\"history-save-status\" role=\"status\"></p></div></details>';"
          new="host.innerHTML='<details id=\"history-details\" '+(historyOpen?'open':'')+'><summary>❤️ Wasze ślady <span id=\"clue-count\"></span></summary><div class=\"history-body\"><p>Odkryte wspomnienia zapisują się na tym urządzeniu.</p><div id=\"clue-fields\"></div><button type=\"button\" class=\"history-done\">Gotowe ❤️</button><p id=\"history-save-status\" role=\"status\"></p></div></details>';"
          if old not in s: raise SystemExit('history html not found')
          s=s.replace(old,new,1)

          old="host.querySelector('details').addEventListener('toggle',e=>historyOpen=e.target.open);const fields=host.querySelector('#clue-fields');"
          new="host.querySelector('details').addEventListener('toggle',e=>historyOpen=e.target.open);host.querySelector('.history-done').onclick=()=>{const d=host.querySelector('details');d.open=false;historyOpen=false};const fields=host.querySelector('#clue-fields');"
          if old not in s: raise SystemExit('history toggle anchor not found')
          s=s.replace(old,new,1)

          # Remove duplicate green memory tile and keep all memory content in orange callout.
          start=s.index('function renderStoryExtras(){')
          end=s.index('function postcardPrompt()', start)
          block=s[start:end]
          oldblock=block
          old_piece="if(!clue){missionButton?.remove();mission?.remove()}else if(mission&&missionButton){missionButton.textContent='❤️ Wspomnienie';const heading=mission.querySelector('b');if(heading)heading.textContent='WSPOMNIENIE ❤️';const entry=document.createElement('div');entry.className='clue-callout';entry.innerHTML='<b>❤️ WASZE WSPOMNIENIE</b><p>Zapisz jedno słowo, zanim ruszycie dalej.</p>';const button=document.createElement('button');button.type='button';button.className='btn m';button.textContent='Zapisz wspomnienie';button.onclick=()=>focusClue(clue.key);entry.append(button);document.querySelector('.stop .done').before(entry)}"
          new_piece="if(!clue){missionButton?.remove();mission?.remove()}else{missionButton?.remove();mission?.remove();const entry=document.createElement('div');entry.className='clue-callout';entry.innerHTML='<b>❤️ WASZE WSPOMNIENIE</b><p>'+WORD_MOMENTS[point.id]+'</p>';const button=document.createElement('button');button.type='button';button.className='btn m';button.textContent='Zapisz wspomnienie';button.onclick=()=>focusClue(clue.key);entry.append(button);document.querySelector('.stop .done').before(entry)}"
          if old_piece not in block: raise SystemExit('memory tile block not found')
          block=block.replace(old_piece,new_piece,1)
          s=s[:start]+block+s[end:]

          # Add close-button styling and keep memory card as sole accent.
          anchor='.nav-fixed{display:flex;align-items:center;justify-content:center;text-decoration:none}'
          repl=anchor+'.history-done{width:100%;min-height:46px;margin-top:12px;border:0;border-radius:12px;background:#b56c45;color:#fff;font-weight:900;font-size:15px}'
          if anchor not in s: raise SystemExit('css anchor not found')
          s=s.replace(anchor,repl,1)

          p.write_text(s)

          # Reset both the main trip state and prologue state.
          p=Path('index.html')
          s=p.read_text()
          old="function resetAll(){if(confirm('Wyzerować całą grę?')){localStorage.removeItem(KEY);location.reload()}}"
          new="function resetAll(){if(confirm('Wyzerować całą grę i prolog?')){localStorage.removeItem(KEY);localStorage.removeItem('budapeszt_prologue_v2');location.reload()}}"
          if old not in s: raise SystemExit('resetAll not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add story.js index.html
          git commit -m 'Simplify memory UX and reset prologue' || exit 0
          git push
