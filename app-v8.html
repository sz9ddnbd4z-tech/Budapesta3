<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173c36"><title>Budapeszt, na dwoje</title><style>html,body{margin:0;background:#f5efe3}iframe{display:block;width:100%;height:100vh;border:0}</style></head><body><iframe id="app" src="./app-v5.html?v=8" title="Budapeszt, na dwoje"></iframe><script>(function(){const f=document.getElementById('app');function enhance(){try{const d=f.contentDocument;if(!d)return;const textNodes=[];const w=document.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())textNodes.push(n);textNodes.forEach(x=>{if(x.nodeValue.includes('Startujecie z bazy. Bez pośpiechu.'))x.nodeValue='To nasza chata — piękna i cudowna. ❤️ Tu zaczyna się i kończy Wasz Budapeszt.';if(x.nodeValue.includes('Kalmár leży przy Szent Gellért tér, blisko Gellért-hegy.'))x.nodeValue='To nasza chata — piękna i cudowna. Kalmár jest Waszą bazą na cały wyjazd, blisko Szent Gellért tér i Gellért-hegy.'});const main=d.getElementById('main');if(!main||main.__fixed)return;main.__fixed=true;const obs=new MutationObserver(function(){const cb=main.querySelector('input[type=checkbox]');if(cb&&!cb.__fixed){cb.__fixed=true;cb.addEventListener('change',function(){setTimeout(function(){const card=main.querySelector('.stop');if(card)card.scrollIntoView({behavior:'smooth',block:'start'});else window.scrollTo({top:0,behavior:'smooth'})},80)})}});obs.observe(main,{childList:true,subtree:true});const oldComplete=f.contentWindow.complete;if(typeof oldComplete==='function'){f.contentWindow.complete=function(id){oldComplete(id);setTimeout(function(){const card=main.querySelector('.stop');if(card)card.scrollIntoView({behavior:'smooth',block:'start'});},120)}}}catch(e){}}f.addEventListener('load',function(){setTimeout(enhance,100)});setInterval(enhance,700)})();</script></body></html>
