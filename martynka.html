<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173c36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budapeszt">
<title>Budapeszt, na dwoje</title>
<style>
:root{--ink:#173c36;--paper:#f5efe3;--accent:#b56c45;--gold:#f4c18f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink)}body{min-height:100dvh;display:grid;place-items:center;padding:22px;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% 0,#315f55 0,#173c36 56%,#0d211d 100%)}main{width:min(100%,640px);text-align:center;position:relative;padding:38px 23px 44px;border:1px solid #ffffff2d;border-radius:28px;background:#173c36d9;box-shadow:0 24px 65px #0008;overflow:hidden}main:before,main:after{content:"";position:absolute;opacity:.32;pointer-events:none}main:before{width:150px;height:200px;top:-70px;left:-47px;border:2px solid var(--gold);border-bottom:0;border-radius:90px 90px 0 0;box-shadow:30px 0 0 -1px #f4c18f55,60px 0 0 -1px #f4c18f55,90px 0 0 -1px #f4c18f55}main:after{width:116px;height:116px;right:-38px;bottom:-35px;border:2px solid var(--accent);border-radius:50%;box-shadow:0 0 0 16px #b56c4522,0 0 0 32px #b56c4515}.ey{color:var(--gold);font-size:10px;font-weight:900;letter-spacing:.2em}.title{font:clamp(48px,14vw,78px)/.84 Georgia,serif;letter-spacing:-.05em;margin:18px 0 22px}.title em{color:var(--gold);font-style:italic}.note{max-width:410px;margin:auto;font:clamp(20px,5vw,27px)/1.35 Georgia,serif;color:#f9f2e6}.count{margin:30px auto 12px;color:var(--gold);font:900 clamp(36px,11vw,58px)/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.03em}.date{margin:0;color:#e5d9c7;font-size:13px;font-weight:750;letter-spacing:.05em}.small{margin:28px 0 0;color:#ffffff99;font-size:12px}.crest{margin:26px auto 0;width:35px;height:45px;overflow:hidden;clip-path:polygon(8% 0,92% 0,100% 14%,92% 76%,50% 100%,8% 76%,0 14%);background:#a53832;border:1px solid #7b2925;position:relative}.crest:before{content:"";position:absolute;inset:0 50% 0 0;background:repeating-linear-gradient(0deg,#f6ead7 0 5px,#b33e35 5px 10px)}.crest:after{content:"☩";position:absolute;right:3px;top:8px;color:#f6ead7;font:27px/1 Georgia,serif}
</style>
</head>
<body>
<main>
<div class="ey">11—14 WRZEŚNIA 2026</div>
<h1 class="title">Budapeszt,<br><em>na dwoje</em></h1>
<p class="note">Walcz dzielnie, Martynko.<br>Bo to już za:</p>
<div class="count" id="count">—</div>
<p class="date">Piątek · 11 września · 18:00 · czas Budapesztu</p>
<div class="crest" aria-hidden="true"></div>
<p class="small">Mała rzecz, na którą warto czekać. ❤️</p>
</main>
<script>
const start=new Date('2026-09-11T18:00:00+02:00').getTime();
function tick(){const seconds=Math.max(0,Math.floor((start-Date.now())/1000));if(!seconds){document.getElementById('count').textContent='TERAZ';return}const d=Math.floor(seconds/86400),h=Math.floor(seconds%86400/3600),m=Math.floor(seconds%3600/60),s=seconds%60;document.getElementById('count').textContent=(d?d+' dni ':'')+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
tick();setInterval(tick,1000);
</script>
</body>
</html>
