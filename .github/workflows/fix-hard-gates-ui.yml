name: Fix hard gates and UI
on:
  push:
    paths:
      - '.github/workflows/fix-hard-gates-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app logic and styles
        run: |
          python - <<'PY'
          from pathlib import Path

          # story.js
          p=Path('story.js')
          s=p.read_text()

          anchor="function gateOK(id){S.unlocks=S.unlocks||{};return !!S.unlocks[id]}"
          if "function canCompletePoint(id)" not in s:
              s=s.replace(anchor,anchor+"\nfunction canCompletePoint(id){const clue=CLUES.find(c=>c.point===id);if(clue&&!S.clues?.[clue.key]?.trim())return {ok:false,type:'clue',key:clue.key};if(!gateOK(id))return {ok:false,type:'gate'};return {ok:true}}",1)

          oldcss=".place-gate,.carry-note{margin:12px 0;padding:12px 14px;border-radius:12px;background:#eef2eb;border-left:3px solid #28554b;font-size:13px;line-height:1.45}.place-gate input{width:100%;min-height:44px;margin:8px 0;padding:10px 12px;border:1px solid #d8cdbb;border-radius:10px;background:#fffaf0;font-size:16px}.carry-note b,.place-gate b{display:block;margin-bottom:4px}.nav-fixed{display:flex;align-items:center;justify-content:center;text-decoration:none}"
          newcss=".place-gate,.carry-note,.clue-callout{margin:14px 0;padding:14px 15px;border:1px solid #d8cdbb;border-radius:15px;background:#faf5eb;box-shadow:0 3px 10px #173c3608;font-size:14px;line-height:1.5}.place-gate input{width:100%;min-height:48px;margin:10px 0 8px;padding:11px 12px;border:1px solid #d8cdbb;border-radius:12px;background:#fffaf0;font-size:16px}.carry-note b,.place-gate b,.clue-callout b{display:block;margin-bottom:5px}.clue-callout{border:2px solid #b56c45;background:#fff3e9;box-shadow:0 7px 18px #b56c4518}.clue-callout p{margin:0 0 10px;font-weight:800}.clue-callout .btn.m{width:100%;background:#b56c45!important;border-color:#b56c45!important;color:#fff!important}.place-gate .btn.m{width:100%;background:#173c36!important;border-color:#173c36!important;color:#fff!important}.nav-fixed{display:flex;align-items:center;justify-content:center;text-decoration:none}"
          if oldcss in s:
              s=s.replace(oldcss,newcss,1)

          s=s.replace("missionButton.textContent='✦ Zapisz wspomnienie'","missionButton.textContent='❤️ Wspomnienie'",1)
          s=s.replace("heading.textContent='MAŁA MISJA'","heading.textContent='WSPOMNIENIE ❤️'",1)
          s=s.replace("entry.innerHTML='<p>Zapisz jedno słowo, zanim ruszycie dalej.</p>'","entry.innerHTML='<b>❤️ WASZE WSPOMNIENIE</b><p>Zapisz jedno słowo, zanim ruszycie dalej.</p>'",1)
          s=s.replace("button.textContent='Wpisz słowo'","button.textContent='Zapisz wspomnienie'",1)

          old="function installRuntimeOverrides(){\n window.weatherPlan=function(){modal('<button class=\"close\" onclick=\"closeM()\">×</button><div class=\"ey\">PLAN B · DESZCZ</div><h2>☔ Wybierzcie schronienie</h2><p>Bez geolokalizacji i bez blokowanych popupów. Wybierzcie wariant, a Mapy Apple wyszukają go w pobliżu.</p><div style=\"display:grid;gap:9px\"><a class=\"btn navroute\" href=\"https://maps.apple.com/?q=museum%20Budapest\" target=\"_blank\" rel=\"noopener\">🏛 Muzeum</a><a class=\"btn navroute\" href=\"https://maps.apple.com/?q=cafe%20Budapest\" target=\"_blank\" rel=\"noopener\">☕ Kawiarnia</a><a class=\"btn navroute\" href=\"https://maps.apple.com/?q=bar%20Budapest\" target=\"_blank\" rel=\"noopener\">🍺 Bar</a></div>')};\n showExactDemoGate();\n}"
          new="function installRuntimeOverrides(){\n const legacyComplete=window.complete;\n window.complete=function(id){const check=canCompletePoint(id),cb=document.querySelector('.stop .done input');if(!check.ok){if(cb)cb.checked=false;if(check.type==='clue'){toastStory('Najpierw zapisz wspomnienie ❤️');focusClue(check.key)}else{toastStory('Najpierw rozwiąż zagadkę z ciekawostki 🔒');document.querySelector('.stop .place-gate input')?.focus()}return false}historyOpen=false;document.getElementById('history-details')?.removeAttribute('open');return legacyComplete(id)};\n window.weatherPlan=function(){const msgs=['Chowamy się na browara!!! 🍺','Czas na winko 🍷','Przekąska i przeczekujemy 🌯','Kawa i coś dobrego ☕','Browarek i przeczekujemy pogodę 🍻','Winko, chwila spokoju i wracamy do gry 🍷','Szybka przekąska i regeneracja 🥪'];const msg=msgs[Math.floor(Math.random()*msgs.length)];modal('<button class=\"close\" onclick=\"closeM()\">×</button><div class=\"ey\">PLAN B</div><h2>'+msg+'</h2>')};\n showExactDemoGate();\n}"
          if old in s:
              s=s.replace(old,new,1)
          else:
              raise SystemExit('installRuntimeOverrides block not found')

          p.write_text(s)

          # index.html: persist unlocks and make the legacy complete path less permissive too.
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("const EMPTY_STATE=()=>({done:{},used:[],clues:{},choices:{}})","const EMPTY_STATE=()=>({done:{},used:[],clues:{},choices:{},unlocks:{}})",1)
          oldload="S={clues:saved.clues,choices:(saved.choices&&typeof saved.choices==='object'&&!Array.isArray(saved.choices))?saved.choices:{},done:(saved.done&&typeof saved.done==='object'&&!Array.isArray(saved.done))?saved.done:{},used:Array.isArray(saved.used)?saved.used.filter(Number.isInteger):[]}"
          newload="S={clues:saved.clues,choices:(saved.choices&&typeof saved.choices==='object'&&!Array.isArray(saved.choices))?saved.choices:{},done:(saved.done&&typeof saved.done==='object'&&!Array.isArray(saved.done))?saved.done:{},used:Array.isArray(saved.used)?saved.used.filter(Number.isInteger):[],unlocks:(saved.unlocks&&typeof saved.unlocks==='object'&&!Array.isArray(saved.unlocks))?saved.unlocks:{}}"
          if oldload in s:
              s=s.replace(oldload,newload,1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add story.js index.html
          git commit -m 'Enforce hard point gates and unify cards' || exit 0
          git push
