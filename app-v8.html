<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173c36"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Budapeszt, na dwoje</title><style>html,body{margin:0;background:#f5efe3}iframe{display:block;width:100%;height:100vh;height:100dvh;border:0}</style></head><body><iframe id="app" src="./app-v5.html?v=20260908e" title="Budapeszt, na dwoje"></iframe><script>(function(){const f=document.getElementById('app');const MAP={"Kalmár Panzió":[47.48354,19.05002],"Kalmár → trasa dzienna":[47.48354,19.05002],"Kalmár — ogarniamy się":[47.48354,19.05002],"Kalmár":[47.48354,19.05002],"Citadella":[47.4862,19.0485],"Góra Gellerta":[47.4865182,19.0496831],"Rudas — nocne kąpanie":[47.4931,19.0455],"Zamek Królewski":[47.4962048,19.0395666],"Kościół Macieja":[47.5019537,19.0341617],"Batthyány tér":[47.506389,19.038611],"Punkt widokowy na Parlament":[47.507121,19.045669],"Most Małgorzaty":[47.5146,19.046],"Węgierska Opera Państwowa":[47.5001,19.0587],"Szimpla / ruin bary":[47.4969648,19.0633459],"Wielka Synagoga Dohány":[47.4959071,19.0606139],"Most Łańcuchowy":[47.4989928,19.0436994],"Parlament — zbiórka":[47.507121,19.045669],"Cookie Beacon Brunch Basilica":[47.5011,19.0543],"Bazylika św. Stefana":[47.5008902,19.0539887],"Mama Goulash":[47.4969,19.061],"Ruin bary":[47.497,19.0633],"Jaskinia Gellérta":[47.4865,19.0497],"Zamek Vajdahunyad":[47.5158,19.0803],"Central Market Hall":[47.4870848,19.058493],"Lotnisko":[47.4385,19.2523]};const DETAILS={
'Kalmár Panzió':['Baza przy Szent Gellért tér jest dobrym punktem startowym do Gellért-hegy. Stąd w kilka minut przechodzicie z miejskiego gwaru w stronę wzgórza i Dunaju.','Zanim ruszycie, zapamiętajcie jeden szczegół okolicy — później sprawdźcie, czy jeszcze go pamiętacie.'],
'Kalmár → trasa dzienna':['Szent Gellért tér leży przy Dunaju, u podnóża Gellért-hegy. To naturalna granica między miejskim Pesztem a bardziej stromą, zieloną Budą.','Zanim ruszycie, spójrzcie w górę: dzisiejsza trasa zaczyna się praktycznie pod wzgórzem.'],
'Kalmár':['Szent Gellért tér jest jednym z charakterystycznych punktów południowej Budy — obok są Gellért-hegy, Dunaj i zabytkowe termy.','Nie traktujcie bazy wyłącznie jako noclegu. To Wasz punkt orientacyjny na cały wyjazd.'],
'Citadella':['Citadella została zbudowana przez Habsburgów po rewolucji węgierskiej 1848–1849. Jej położenie pozwalało kontrolować miasto z góry, więc widok jest tu częścią historii miejsca.','Najpierw popatrzcie na Dunaj, potem obróćcie się i zobaczcie, jak szybko wzgórze przechodzi w gęstą zabudowę.'],
'Góra Gellerta':['Gellért-hegy wznosi się około 140 m nad Dunajem. Nazwa wiąże wzgórze ze św. Gerardem (Gellértem), jednym z ważnych świętych węgierskiej tradycji.','Nie szukajcie tylko panoramy. Zwróćcie uwagę na dachy, podwórka i układ ulic poniżej.'],
'Rudas — nocne kąpanie':['Rdzeń Rudas pochodzi z epoki osmańskiej i zachował charakterystyczną ośmiokątną salę z kopułą. Współczesny kompleks łączy historyczny hammam z częścią wellness i basenem panoramicznym.','W nocy największą atrakcją jest kontrast: ciepła woda, ciemne niebo i rozświetlony Budapeszt. Aktualnie nocne kąpiele odbywają się w piątki i soboty 22:00–03:00 — sprawdźcie zasady i bilety przed wejściem.'],
'Zamek Królewski':['Budavári Palota był siedzibą władców, a dzisiejszy kompleks jest w dużej mierze efektem odbudowy po ciężkich zniszczeniach II wojny światowej. W pałacu działa m.in. Węgierska Galeria Narodowa.','Zamiast zaliczać dziedzińce, znajdźcie jeden kadr, w którym architektura wygląda jak scenografia filmu.'],
'Kościół Macieja':['Kościół Macieja przez wieki był miejscem królewskich ceremonii, a w czasach osmańskich pełnił funkcję meczetu. Dzisiejszy wygląd mocno wiąże się z XIX-wieczną przebudową.','Najpierw dach, potem wnętrze. Kolorowe dachówki są jednym z najbardziej charakterystycznych elementów całej dzielnicy zamkowej.'],
'Batthyány tér':['Plac po budzińskiej stronie Dunaju daje jeden z najbardziej czytelnych widoków na Parlament — szczególnie dobrze widać jego symetrię i kopułę.','Stańcie trochę dalej od brzegu. Spróbujcie znaleźć punkt, z którego Parlament wygląda idealnie centralnie.'],
'Punkt widokowy na Parlament':['Parlament ma 96 m wysokości — podobnie jak Bazylika św. Stefana. Liczba 96 nawiązuje do roku 896, tradycyjnie uznawanego za początek węgierskiego osadnictwa w Kotlinie Karpackiej.','Nie róbcie od razu zdjęcia. Najpierw znajdźcie własny kadr, a dopiero potem porównajcie go z pocztówkowymi ujęciami.'],
'Most Małgorzaty':['Most Małgorzaty otwarto w 1876 r. i jest nietypowy, bo łączy Budę i Peszt z Wyspą Małgorzaty. Jego charakterystyczny kąt wynika właśnie z konieczności doprowadzenia odnogi na wyspę.','Spójrzcie wzdłuż Dunaju w obie strony. Ten most daje zupełnie inny rytm panoramy niż Lánchíd.'],
'Kalmár — ogarniamy się':['To nie atrakcja, tylko kontrolowany pit stop. Najważniejsze przed Operą: woda, telefon, bilety, szybki reset i wyjście o czasie.','Nie pozwólcie, żeby „jeszcze tylko pięć minut” zjadło spektakl.'],
'Węgierska Opera Państwowa':['Gmach Opery otwarto w 1884 r. według projektu Miklósa Ybla. Wnętrze miało być pokazem możliwości węgierskiej architektury i rzemiosła końca XIX wieku.','Przed spektaklem popatrzcie na schody, loże i sufit. W tym miejscu sama droga na widownię jest częścią doświadczenia.'],
'Szimpla / ruin bary':['Szimpla Kert należy do miejsc, które spopularyzowały kulturę ruin barów. Koncepcja polegała na adaptowaniu starych, nieużywanych przestrzeni zamiast tworzenia klasycznego baru od zera.','Nie oceniajcie miejsca po pierwszych 30 sekundach. Wejdźcie głębiej i znajdźcie najbardziej absurdalny przedmiot albo zakamarek.'],
'Wielka Synagoga Dohány':['Synagoga przy Dohány utca została ukończona w 1859 r. i jest największą synagogą w Europie pod względem pojemności. Jej architektura łączy wpływy mauretańskie i romantyczne.','Z ulicy zwróćcie uwagę na wieże i rytm fasady. To budynek, który z daleka wygląda niemal jak pałac.'],
'Most Łańcuchowy':['Széchenyi Lánchíd otwarto w 1849 r. Był pierwszym stałym mostem łączącym Budę i Peszt i stał się jednym z symboli narodzin nowoczesnego Budapesztu.','Sprawdźcie lwy, ale nie kończcie na nich. Stańcie na chwilę na osi mostu i zobaczcie, jak budynki ustawiają się względem Dunaju.'],
'Parlament — zbiórka':['Országház jest siedzibą węgierskiego parlamentu i miejscem przechowywania Świętej Korony. Budynek ma 691 pomieszczeń i charakterystyczną kopułę o wysokości 96 m.','To punkt, przy którym zegarek wygrywa z improwizacją. O 12:00 jesteście na miejscu; potem spokojnie czekacie na wejście.'],
'Cookie Beacon Brunch Basilica':['To celowo lekki przystanek między zwiedzaniem Parlamentu a dalszym spacerem. Po intensywnym poranku najlepsza ciekawostka jest prosta: dobra kawa i coś, czego normalnie byście nie zamówili.','Zamiast wybierać najbezpieczniejszą rzecz, weźcie jeden element menu na próbę.'],
'Bazylika św. Stefana':['Bazylika nosi imię Stefana I, pierwszego króla Węgier. Przechowywana jest tu relikwia zwana Świętą Prawicą. Kopuła ma 96 m wysokości, tyle samo co Parlament.','Sprawdźcie, ile razy powtarza się motyw symetrii. Potem poszukajcie jednego detalu, który tę symetrię łamie.'],
'Mama Goulash':['Gulyás nie jest po prostu „węgierskim gulaszem” w polskim znaczeniu — tradycyjnie jest bliżej zupy jednogarnkowej, z mięsem, cebulą, papryką i ziemniakami.','Zamówcie coś, czego żadne z Was wcześniej nie jadło. Jedno danie niech będzie wspólne.'],
'Ruin bary':['Żydowska dzielnica Pesztu stała się centrum nocnego życia m.in. dzięki adaptacji pustych kamienic i podwórek na bary, kluby i miejsca kultury.','Zamiast polować na „najlepszy bar”, wybierzcie ten, który ma najdziwniejsze wnętrze.'],
'Jaskinia Gellérta':['Gellért-hegy kryje system naturalnych jaskiń związanych z wapiennym wnętrzem wzgórza. Część przestrzeni została z czasem wykorzystana także do celów religijnych i użytkowych.','To ma być krótki, ostatni budański akcent — bardziej ciekawostka niż kolejne „must see”.'],
'Zamek Vajdahunyad':['Vajdahunyad powstał w związku z obchodami tysiąclecia państwa węgierskiego w 1896 r. Kompleks celowo miesza style — od romańskiego i gotyku po renesans i barok — tworząc architektoniczny kolaż.','Znajdźcie fragment, który wygląda jak prawdziwy średniowieczny zamek, i drugi, który zdradza, że to architektura znacznie młodsza.'],
'Central Market Hall':['Nagycsarnok otwarto w 1897 r. według projektu Samu Pecza. Charakterystyczna stalowa konstrukcja i ogromna hala pokazują, jak bardzo rozwój miasta pod koniec XIX wieku opierał się na nowoczesnej infrastrukturze.','Na parterze szukajcie produktów i zapachów, na górze — pamiątek. To dobry moment na jedną małą rzecz zamiast zakupowego maratonu.'],
'Lotnisko':['Ostatni punkt nie jest atrakcją. Jest bezpiecznikiem planu — macie dotrzeć na lotnisko z zapasem, a nie urządzać sprint przez terminal.','Przed wejściem sprawdźcie dokumenty, telefon, bilety i ładowanie. Dopiero potem uznajcie wyjazd za zakończony.']};
function enhance(){try{const d=f.contentDocument;if(!d)return;const main=d.getElementById('main');if(!main)return;d.querySelectorAll('.stop').forEach(card=>{const h=card.querySelector('h3')?.textContent?.trim()||'';const c=MAP[h];if(c){const href='https://maps.apple.com/?ll='+c[0]+','+c[1]+'&q='+encodeURIComponent(h);let a=[...card.querySelectorAll('a')].find(x=>/Apple|Nawiguj/i.test(x.textContent||''));if(!a){const grid=card.querySelector('.grid');if(grid){a=d.createElement('a');a.className='btn m';a.textContent='🧭 Apple Maps — NAWIGUJ';grid.appendChild(a)}}if(a){a.href=href;a.target='_self';a.removeAttribute('rel')}}const detail=DETAILS[h];if(detail){const answers=[...card.querySelectorAll('.ans')];const fact=answers.find(x=>x.textContent.includes('CIEKAWOSTKA'));const see=answers.find(x=>x.textContent.includes('CO WIDZIMY'));if(fact)fact.innerHTML='<b>CIEKAWOSTKA</b><br>'+detail[0];if(see)see.innerHTML='<b>CO WIDZIMY</b><br>'+detail[1]}})}catch(e){console.log('Budapeszt enhance',e)}}f.addEventListener('load',()=>{setTimeout(enhance,150);try{const d=f.contentDocument;const main=d?.getElementById('main');if(main)new MutationObserver(()=>requestAnimationFrame(enhance)).observe(main,{childList:true,subtree:true})}catch(e){}});window.addEventListener('pageshow',()=>setTimeout(enhance,100));})();</script></body></html>
