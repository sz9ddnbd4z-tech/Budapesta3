const actions=[['🤝','10 minut za rękę. Reszta świata poczeka.'],['👀','60 sekund bez telefonu. Patrzcie na siebie albo miasto.'],['🤫','5 minut ciszy. Idźcie obok siebie.'],['📸','Zróbcie zdjęcie, którego nie wolno oglądać do końca dnia.'],['💬','Powiedz drugiej osobie jedną rzecz, którą dziś zrobiła dobrze.'],['💃','30 sekund tańca. Tu, gdzie stoicie.'],['🚪','Znajdźcie najciekawsze drzwi w promieniu 100 metrów.'],['🐈','Znajdźcie kota. To teraz najważniejszy punkt.'],['🍺','Następny lokal wybiera osoba, która pierwsza zobaczy coś czerwonego.'],['🇭🇺','Zamówcie coś, czego żadne z Was nie umie wymówić.'],['🧭','Przez 300 metrów kierunek wybiera tylko jedna osoba.'],['❤️','Powiedzcie sobie: „Dobrze, że tu jesteśmy, bo…”'],['🔎','Znajdźcie detal, którego zwykły turysta może nie zauważyć.']];

function inject(doc,src){return new Promise((resolve,reject)=>{const s=doc.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;doc.head.appendChild(s)})}
function styleMap(doc){const st=doc.createElement('style');st.textContent='.map.real-map{padding:15px}.real-map #realmap{height:360px;border-radius:13px;overflow:hidden;box-shadow:inset 0 0 0 1px #d8cdbb}.real-map .leaflet-container{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.real-map .leaflet-popup-content{font-weight:700;color:#18322f}.real-map .leaflet-control-attribution{font-size:9px}';doc.head.appendChild(st)}
async function enhance(){const w=frame.contentWindow,d=frame.contentDocument;if(!d)return;document.getElementById('loading').classList.add('hide');styleMap(d);
const oldMaps=d.querySelectorAll('.map');if(oldMaps.length){const box=oldMaps[0];box.classList.add('real-map');const svg=box.querySelector('svg');if(svg)svg.remove();const p=box.querySelector('p');if(p)p.textContent='Prawdziwa mapa Budapesztu · OpenStreetMap. Pinezki pokazują Wasze punkty wyprawy.';const h=box.querySelector('h2');if(h)h.textContent='Wasza mapa';const mapDiv=d.createElement('div');mapDiv.id='realmap';box.appendChild(mapDiv);try{await inject(d,'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js')}catch(e){mapDiv.innerHTML='<div style="padding:20px;font-weight:800">Mapa wymaga połączenia z internetem.</div>';return}const link=d.createElement('link');link.rel='stylesheet';link.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';d.head.appendChild(link);await new Promise(r=>setTimeout(r,80));const map=w.L.map(mapDiv,{scrollWheelZoom:false,zoomControl:true}).setView([47.4988,19.052],13);w.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);pins.forEach(([name,lat,lng])=>{w.L.marker([lat,lng]).addTo(map).bindPopup('<b>'+name+'</b>')});setTimeout(()=>map.invalidateSize(),150);}
// Only the kiss may repeat. Every other spontaneous action is removed from the pool until all have appeared.
w.surprise=function(){if(!pool.length)pool=[...actions];const i=Math.floor(Math.random()*pool.length),a=pool.splice(i,1)[0];const html='<button class="close" onclick="closeM()">×</button><div class="ey">BUDAPESZT MA DLA WAS ZADANIE</div><h2>'+a[0]+'</h2><p style="font:22px/1.4 Georgia,serif">'+a[1]+'</p>'+(a[1].includes('10 minut')?'<button class="random" onclick="timer10()">▶ START TIMER 10:00</button>':'');w.modal(html)};
// After marking a point complete, jump straight to the newly active point.
let busy=false;d.addEventListener('change',e=>{if(!e.target.matches('.done input'))return;setTimeout(()=>{const main=d.querySelector('#main');if(main){const top=main.getBoundingClientRect().top+w.scrollY-10;w.scrollTo({top,behavior:'smooth'})}},120)});
// Remove the typo from the old random-action data if it is ever reached by cached code.
const observer=new MutationObserver(()=>{const txt=d.body.innerHTML;if(txt.includes('Buziaak. Teraz. Bez negocjacji.'))d.body.innerHTML=d.body.innerHTML.replaceAll('Buziaak. Teraz. Bez negocjacji.','Buziak. Teraz. Bez negocjacji.')});
// Do not observe continuously; the replacement above is enough for static DOM.
}
frame.addEventListener('load',()=>{enhance();setTimeout(()=>{try{frame.style.height=frame.contentDocument.documentElement.scrollHeight+'px'}catch(e){}},300);setInterval(()=>{try{frame.style.height=Math.max(frame.contentDocument.documentElement.scrollHeight,window.innerHeight)+'px'}catch(e){}},700)});
