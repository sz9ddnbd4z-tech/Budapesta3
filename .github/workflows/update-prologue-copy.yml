name: Update prologue copy
on:
  push:
    paths:
      - '.github/workflows/update-prologue-copy.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update prologue texts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('story.js')
          s=p.read_text()
          replacements={
          "Grubcia i Diuncia zostają na posterunku. Prawdopodobnie uznają, że cały ten wyjazd to przesadnie skomplikowany sposób zdobycia jedzenia.":"Grubcia i Diuncia zostają w domku — czyli dokładnie tam, gdzie im najlepiej. 🐈🐈",
          "Misja od Grubci i Diunci: zjeść tak, jakby żadna z nich nigdy nie próbowała wyrwać jedzenia prosto z ręki.":"Misja od Grubci: jeść tak, jakby jutra miało nie być. 🐈",
          "McDonald’s na lotnisku w Gdańsku działa od pierwszego do ostatniego lotu i znajduje się już w strefie odlotów Schengen.":"McDonald’s na lotnisku to już nasza mała tradycja przed wylotem. Wybierz sobie, na co masz ochotę — dziś nic nie narzucamy. 🍟",
          "Grubcia i Diuncia w tym momencie prawdopodobnie śpią dokładnie tam, gdzie nie wolno.":"Diuncia pewnie śpi sobie w domku, a Grubcia oczywiście na Twojej piżamce. 🐈🐈"
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'not found: {old}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add story.js
          git commit -m 'Personalize prologue jokes and McDonalds copy' || exit 0
          git push
