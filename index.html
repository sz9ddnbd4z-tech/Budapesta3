{title:'Piątek — wejście w noc',date:'11 IX',h:['18:00–19:00 · coś się zaczyna','22:00 · noc ma swój plan'],p:[P('f1','🏠','START','Kalmár Panzió','18:00–19:00','Startujecie z bazy. Bez pośpiechu.','Kalmár leży przy Szent Gellért tér, blisko Gellért-hegy.','Martynka: wybierz jedno słowo na ten wyjazd.','→ Citadella · 0,6 km / ok. 10 min pieszo',47.48354,19.05002),P('f2','🏰','WIDOK','Citadella','po starcie','Szukajcie miejsca, z którego miasto wygląda jak jedna kompozycja.','Citadella leży na Gellért-hegy i daje szeroki widok na oba brzegi Dunaju.','Bartek: znajdź trzy mosty bez ruszania się z miejsca.','→ Góra Gellerta · 0,3 km / 5 min',47.4862,19.0485),P('f3','⛰️','PANORAMA','Góra Gellerta','dalej','Odwróćcie się od najbardziej oczywistego widoku. Patrzcie niżej: dachy, ulice, światła.','Wzgórze wznosi się ok. 140 m nad Dunajem.','60 sekund bez telefonów.','→ Rudas · 1,0 km / 15–20 min',47.4865182,19.0496831),P('f4','🧖','MUST · NOC','Rudas — nocne kąpanie','22:00–03:00','Po zmroku termy mają zupełnie inny klimat.','Rudas ma ponad 450 lat; nocne kąpanie odbywa się w piątki i soboty 22:00–03:00.','10 minut bez telefonów przed wejściem.','→ Kalmár · 1,0 km / 15 min',47.4931,19.0455,true)]},
{title:'Sobota — Buda → Opera → noc',date:'12 IX',h:['rano · ruszacie w stronę Budy','17:30 · wychodzicie z Kalmára','18:30 · coś zaczyna się w Operze','po 21:00 · nocna część trasy'],p:[P('s1','🏠','START','Kalmár → trasa dzienna','rano','Dziś idziecie punkt po punkcie.','Buda i Peszt mają różny rytm ulic i widoków.','Bartek: wybierz budynek, w którym mógłbyś zamieszkać.','→ Zamek · transport wg BudapestGO',47.48354,19.05002),P('s2','👑','BUDA','Zamek Królewski','dalej','Znajdźcie taras, gdzie możecie chwilę nic nie robić.','Dzisiejszy kompleks jest w dużej mierze efektem powojennej odbudowy.','Martynka: znajdź najładniejszą linię fasady.','→ Kościół Macieja · 0,6 km / 10 min',47.4962048,19.0395666),P('s3','⛪','KLASYK','Kościół Macieja','dalej','Popatrzcie wysoko — dach jest jednym z symboli wzgórza.','Kolorowe dachówki kojarzone są z manufakturą Zsolnay.','Każde wybiera detal, którego drugie nie zauważyło.','→ Batthyány tér · 0,9 km / 12–15 min',47.5019537,19.0341617),P('s4','📍','DUNAJ','Batthyány tér','dalej','Parlament powinien być po drugiej stronie rzeki.','To klasyczny punkt widokowy na Parlament.','Zróbcie jedno zdjęcie jak starą pocztówkę.','→ Parlament · 0,7 km / 10 min',47.506389,19.038611),P('s5','🏛️','WIDOK','Punkt widokowy na Parlament','dalej','Znajdźcie swój kadr, nie „najlepszy”.','Parlament ma 96 m wysokości — tyle samo co Bazylika św. Stefana.','Znajdźcie trzy różne odcienie kamienia.','→ Most Małgorzaty · 0,8 km / 12 min',47.507121,19.045669),P('s6','🌉','SPACER','Most Małgorzaty','dalej','Spójrzcie na oba brzegi Dunaju.','Most łączy Budę, Peszt i Wyspę Małgorzaty.','10 minut za rękę.','→ Kalmár · ok. 3 km / 40 min lub transport',47.5146,19.046),P('s7','🚿','CHECKPOINT','Kalmár — ogarniamy się','przed 17:30','Prysznic, przebranie, woda. Szybki reset.','Opera jest najważniejszym punktem soboty.','Alarm 17:25. O 17:30 wychodzicie. Skracamy ogarnianie, nie Operę.','→ Opera · transport publiczny 25–30 min',47.48354,19.05002,true),P('s8','🎭','MUST','Węgierska Opera Państwowa','18:00 na miejscu · 18:30–21:00','Złoto, schody, światło. Rozejrzyjcie się przed spektaklem.','12 IX 2026: „Dancingly Yours”, 18:30–21:00.','Martynka + Bartek: wybierzcie po jednym detalu na pamiątkę.','→ Szimpla · 1,0 km / 15 min pieszo',47.5001,19.0587,true),P('s9','🍺','NOC','Szimpla / ruin bary','po Operze','Teraz niczego nie trzeba zaliczać.','Szimpla jest jednym z symboli kultury ruin barów.','Pierwszy lokal wybiera Martynka, następny Bartek.','→ Dohány · 0,4 km / 6 min',47.4969648,19.0633459),P('s10','✡️','NOC','Wielka Synagoga Dohány','po drodze','Obejrzyjcie fasadę i proporcje z ulicy.','To największa synagoga w Europie pod względem pojemności.','Znajdźcie detal bardziej pałacowy niż sakralny.','→ Kalmár · 2,2 km / 30 min lub transport',47.4959071,19.0606139)]},

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Nie udało się zapisać postępu.');console.warn('Błąd zapisu postępu',e)}progress()}function complete(id){S.done[id]=true;save();render();requestAnimationFrame(()=>window.scrollTo({top:document.querySelector('.head').offsetTop-8,behavior:'smooth'}))}function undo(id){delete S.done[id];save();render();requestAnimationFrame(()=>window.scrollTo({top:document.querySelector('.head').offsetTop-8,behavior:'smooth'}))}function dayOK(i){return D[i].p.every(x=>S.done[x.id])}function go(i){if(i>0&&!dayOK(i-1)){toast('🔒 Najpierw 100% poprzedniego dnia.');return}active=i;render();window.scrollTo({top:document.querySelector('.tabs').offsetTop-5,behavior:'smooth'})}function toggle(id,k){document.getElementById(id+k).classList.toggle('open')}function mapsUrl(p){return 'https://maps.apple.com/?ll='+p.lat+','+p.lng+'&q='+encodeURIComponent(p.name)}function resetAll(){if(confirm('Wyzerować całą grę?')){localStorage.removeItem(KEY);location.reload()}}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',2200)}function surprise(){let used=S.used||[],available=A.filter((_,i)=>!used.includes(i));if(!available.length){S.used=[];used=[];available=A.filter((_,i)=>!used.includes(i))}let realIndex=A.indexOf(available[Math.floor(Math.random()*available.length)]);S.used.push(realIndex);save();let a=A[realIndex];document.getElementById('modalbox').innerHTML='<button class="close" onclick="closeM()">×</button><div class="ey">BUDAPESZT MA DLA WAS ZADANIE</div><h2>'+a[0]+'</h2><p style="font:22px/1.4 Georgia,serif">'+a[1]+'</p>';document.getElementById('modal').classList.add('open')}function closeM(){document.getElementById('modal').classList.remove('open')}function progress(){let all=D.flatMap(x=>x.p),n=all.filter(x=>S.done[x.id]).length,p=Math.round(n/all.length*100);bar.style.width=p+'%';pct.textContent=p+'% wycieczki · '+n+'/'+all.length+' punktów'}
function render(){let x=D[active],idx=x.p.findIndex(p=>!S.done[p.id]);document.querySelectorAll('.tabs button').forEach((b,i)=>{b.classList.toggle('active',i===active);b.classList.toggle('lock',i>0&&!dayOK(i-1))});let h='<section class="head"><div class="ey">DZIEŃ '+(active+1)+'</div><h2>'+x.title+'</h2><p>'+x.date+'</p><div class="hint"><b>PLAN DNIA — TYLKO WSKAZÓWKI</b>'+x.h.map(v=>'<br>'+v).join('')+'</div></section>';if(idx<0)h+='<div class="lockedday"><h2>🎉 100% DNIA</h2><p>Następny rozdział jest odblokowany.</p></div>';else{if(idx>0){const prev=x.p[idx-1];h+='<button class="btn" type="button" onclick="undo(\''+prev.id+'\')">↶ Cofnij ostatni punkt</button>'}let p=x.p[idx];h+=card(p)}main.innerHTML=h;progress()}function card(p){return '<article class="stop '+(p.must?'must':'')+'"><div class="sh"><div class="ic">'+p.icon+'</div><div><h3>'+p.name+'</h3><div class="tag">'+p.tag+'</div></div></div><div class="when">🕰 '+p.time+'</div><div class="leg">'+p.leg+'</div><div class="grid"><button class="btn" onclick="toggle(\''+p.id+'\',\'s\')">👀 Co widzimy?</button><button class="btn" onclick="toggle(\''+p.id+'\',\'f\')">🔓 Ciekawostka</button><button class="btn m" onclick="toggle(\''+p.id+'\',\'m\')">🕵️ Misja</button><a class="btn" href="'+mapsUrl(p)+'" target="_blank" rel="noopener noreferrer">🧭 Apple Maps</a></div><div class="ans" id="'+p.id+'s"><b>CO WIDZIMY?</b><br>'+p.see+'</div><div class="ans" id="'+p.id+'f"><b>CIEKAWOSTKA</b><br>'+p.fact+'</div><div class="ans" id="'+p.id+'m"><b>MISJA</b><br>'+p.mission+'</div><label class="done"><input type="checkbox" onchange="complete(\''+p.id+'\')"> Jesteśmy na miejscu — zalicz punkt</label></article>'}
function initMap(){const host=document.getElementById('map');if(!window.L){host.innerHTML='<p>Mapa jest chwilowo niedostępna. Korzystajcie z przycisków Apple Maps przy punktach trasy.</p>';return}try{let map=L.map(host,{scrollWheelZoom:false}).setView([47.4988,19.052],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).on('tileerror',()=>{console.warn('Nie udało się wczytać części mapy')}).addTo(map);D.flatMap(x=>x.p).forEach(p=>L.marker([p.lat,p.lng]).addTo(map).bindPopup('<b>'+p.name+'</b><br>'+p.tag))}catch(e){console.warn('Mapa niedostępna',e);host.innerHTML='<p>Mapa jest chwilowo niedostępna. Korzystajcie z przycisków Apple Maps przy punktach trasy.</p>'}}render();initMap();if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Offline niedostępny',e)))};</script></body></html>
