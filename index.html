rska Opera Państwowa','18:00 na miejscu · 18:30–21:00','Złoto, schody, światło. Rozejrzyjcie się przed spektaklem.','12 IX 2026: „Dancingly Yours”, 18:30–21:00.','Martynka + Bartek: wybierzcie po jednym detalu na pamiątkę.','→ Szimpla · 1,0 km / 15 min pieszo',47.5001,19.0587,true),P('s9','🍺','NOC','Szimpla / ruin bary','po Operze','Teraz niczego nie trzeba zaliczać.','Szimpla jest jednym z symboli kultury ruin barów.','Pierwszy lokal wybiera Martynka, następny Bartek.','→ Dohány · 0,4 km / 6 min',47.4969648,19.0633459),P('s10','✡️','NOC','Wielka Synagoga Dohány','po drodze','Obejrzyjcie fasadę i proporcje z ulicy.','To największa synagoga w Europie pod względem pojemności.','Znajdźcie detal bardziej pałacowy niż sakralny.','→ Kalmár · 2,2 km / 30 min lub transport',47.4959071,19.0606139)]},
{title:'Niedziela — Parlament ma pierwszeństwo',date:'13 IX',h:['rano · Most Łańcuchowy','12:00 · ważne miejsce','12:45 · wejście','po zwiedzaniu · brunch i Peszt'],p:[P('n1','🏠','START','Kalmár','rano','Ruszacie spokojnie. Najpierw Dunaj i Most Łańcuchowy.','Dzień jest zbudowany wokół jednego twardego punktu.','Bartek: sprawdźcie bilety i godzinę wejścia.','→ Most Łańcuchowy · 2,0 km / 30 min',47.48354,19.05002),P('n2','🌉','RANO','Most Łańcuchowy','przed południem','Przejdźcie kawałek mostem i spójrzcie ku Zamkowi.','Most otwarto w 1849 r.','Znajdźcie lwy.','→ Parlament · 1,0 km / 15 min',47.4989928,19.0436994),P('n3','🏛️','TWARDY CHECKPOINT','Parlament — zbiórka','12:00','O 12:00 jesteście na miejscu.','Wejście na zwiedzanie o 12:45.','Nie dokładamy niczego pomiędzy.','→ wejście 12:45',47.507121,19.045669,true),P('n4','🍪','BRUNCH','Cookie Beacon Brunch Basilica','po zwiedzaniu','Kawa, coś słodkiego albo konkretny brunch.','Lekki punkt na energię, nie kolejne zadanie.','Zamówcie jedną rzecz, której normalnie byście nie wybrali.','→ Bazylika · 0,3 km / 5 min',47.5011,19.0543),P('n5','⛪','PESZT','Bazylika św. Stefana','dalej','Plac, kopuła i symetria fasady.','Bazylika ma 96 m wysokości — tyle samo co Parlament.','Znajdźcie powtarzający się detal.','→ Mama Goulash · 0,8 km / 12 min',47.5008902,19.0539887),P('n6','🍲','JEDZENIE','Mama Goulash','dalej','Czas na konkretniejsze jedzenie.','Gulyás to jedna z najbardziej rozpoznawalnych potraw kuchni węgierskiej.','Zamówcie coś, czego żadne z Was nie jadło.','→ ruin bary · 0,7 km / 10 min',47.4969,19.061),P('n7','🍺','WIECZÓR','Ruin bary','wieczorem','Nie ma już żadnego must.','Dzielnica żydowska jest centrum nocnego życia Budapesztu.','Losujcie akcję.','→ Kalmár · 2,2 km / 30 min',47.497,19.0633),P('n8','🏠','META','Kalmár','koniec','Wracacie do bazy.','Trzy dni miasta stają się prywatnymi wspomnieniami.','Każde mówi jedną rzecz, którą chce zapamiętać.','—',47.48354,19.05002)]},
{title:'Poniedziałek — ostatnia pętla',date:'14 IX',h:['rano · ostatni spacer','około 13:00 · kierunek lotnisko','14:55 · cel na lotnisku','16:55 · lot'],p:[P('m1','🏠','START','Kalmár','rano','Zostawiacie bagaż i ruszacie na ostatnią pętlę.','Najważniejsze jest zachowanie zapasu czasu.','Ostatnie zdjęcie Budapesztu: bez pozowania.','→ Jaskinia Gellérta · 0,4 km / 6 min',47.48354,19.05002),P('m2','🕳️','OSTATNI SPACER','Jaskinia Gellérta','rano','Ostatni budański punkt. Krótko i bez ciśnienia.','Jaskinia jest związana z krajobrazem Gellért-hegy i historią miejsc sakralnych miasta.','Znajdźcie najbardziej zaskakujący detal.','→ Vajdahunyad · transport 50–60 min',47.4865,19.0497),P('m3','🏰','PESZT','Zamek Vajdahunyad','dalej','Mieszanka stylów: romański, gotycki, renesansowy i barokowy.','Kompleks powstał przy wystawie milenijnej z 1896 r.','Wybierzcie fragment jak z filmu.','→ Central Market Hall · transport 35–45 min',47.5158,19.0803),P('m4','🏪','FINAŁ','Central Market Hall','przed wyjazdem','Ostatni spacer po hali i ewentualnie mała pamiątka.','Wielka Hala Targowa została otwarta w 1897 r.','Kupcie jedną małą rzecz jako „Budapeszt 2026”.','✈️ → lotnisko · wyjazd ok. 13:00–13:15',47.4870848,19.058493),P('m5','✈️','KONIEC','Lotnisko','cel 14:55','Tu gra się kończy. Lot o 16:55.','Zostawiamy bezpieczny zapas przed odlotem.','Martynka + Bartek: wybierzcie następny wspólny weekend.','—',47.4385,19.2523,true)]}];
const GUIDE={"f1":{"fact":"Kalmár stoi przy południowym krańcu centrum Budy, więc pierwsze spojrzenie na miasto będzie od strony wzgórz, a nie pocztówkowego Pesztu. To dobry punkt, by zauważyć różnicę między spokojniejszą, bardziej stromą Budą a gęstszym, miejskim rytmem drugiego brzegu. Zostawcie sobie chwilę na sprawdzenie wody, baterii i wygodnych butów.","mission":"Tu zaczyna się Wasza nić przewodnia. Wybierzcie jedno krótkie słowo dla całego wyjazdu i zapamiętajcie je; będzie wracało przy każdym ważnym punkcie."},"f2":{"fact":"Citadella powstała po wydarzeniach Wiosny Ludów i przez lata była symbolem kontroli nad miastem. Dziś jej największą wartością jest panorama: Dunaj pokazuje, że Buda i Peszt są dwoma różnymi miastami połączonymi mostami. O zmroku światła dobrze odsłaniają układ nabrzeży.","mission":"Wróćcie do słowa z Kalmára. Bartek wybiera trzy mosty, które najbardziej do niego pasują, a Martynka wybiera jeden widok, który chce zachować do końca wyjazdu."},"f3":{"fact":"Gellért-hegy wyrasta stromo nad Dunajem i daje perspektywę, której nie da się uzyskać na poziomie ulicy. Nazwa wzgórza odwołuje się do św. Gellérta, jednego z najważniejszych patronów Węgier. Najciekawsze kadry często są niżej niż punkt widokowy: na dachach, torach tramwajowych i w rytmie mostów.","mission":"Znajdźcie jeden mały detal, którego nie wybrałby zwykły turysta. Nazwijcie go po cichu swoim znakiem piątkowego wieczoru; przy Operze sprawdzicie, czy odnajdziecie jego odpowiednik."},"f4":{"fact":"Rudas łączy osmańską architekturę łaźni z nowoczesnymi basenami i widokiem na Dunaj. Jego charakterystyczna kopuła nad ośmiokątnym basenem przypomina, że kąpiel była tu częścią miejskiej kultury od stuleci. Wieczorem to miejsce ma być finałem spaceru, nie kolejnym punktem do odhaczenia.","mission":"Przed wejściem wypowiedzcie Wasze słowo i przypomnijcie detal z Gellérta. Potem odkładacie telefony na dziesięć minut: pierwsza wspólna pauza będzie punktem odniesienia dla reszty podróży."},"s1":{"fact":"Sobota zaczyna się w Budzie, gdzie odległości na mapie bywają krótkie, ale różnice wysokości zmieniają tempo spaceru. Nie ścigajcie się z listą miejsc; trasa została ułożona tak, aby po widokach wrócić do bazy przed Operą. Zapas czasu jest dziś częścią atrakcji.","mission":"Przypomnijcie piątkowe słowo i detal. Bartek wybiera budynek, w którym mógłby zamieszkać, a Martynka zapisuje w pamięci jego pierwszy wybór; wieczorem porównacie go z Operą."},"s2":{"fact":"Zamek Królewski był przez wieki siedzibą władców, a jego obecna forma jest wynikiem wielu przebudów i powojennej odbudowy. Z tarasów najlepiej widać, jak Dunaj organizuje całe miasto. Warto patrzeć nie tylko na monumentalne fasady, lecz także na przejścia między dziedzińcami.","mission":"Wybierzcie jedną linię fasady i połączcie ją z wczorajszym detalem z Gellérta. To pierwszy duet motywów Waszej gry: natura i architektura."},"s3":{"fact":"Kościół Macieja rozpoznacie po kolorowym dachu i bogatej, neogotyckiej sylwetce. Jego historia jest starsza niż obecny wygląd, a kolejne odbudowy zostawiły tu wiele warstw. Podejdźcie blisko, bo z bliska wzory i faktury robią większe wrażenie niż cała bryła.","mission":"Każde wybiera jeden detal, którego druga osoba jeszcze nie zauważyła. Nie zdradzajcie wyboru do Batthyány tér; tam połączycie oba detale w jedną prywatną pocztówkę."},"s4":{"fact":"Batthyány tér jest jednym z najlepszych miejsc, by zobaczyć Parlament jako element panoramy, a nie pojedynczy zabytek. Rzeka tworzy tu naturalny dystans, dzięki któremu fasada budynku jest czytelna w całości. To także dobry moment, by zauważyć, jak różnie brzmią oba brzegi miasta.","mission":"Pokażcie sobie detale z Kościoła Macieja. Zróbcie jedno zdjęcie, które łączy oba wybory, i nadajcie mu tytuł nawiązujący do Waszego słowa."},"s5":{"fact":"Węgierski Parlament jest jednym z najbardziej rozpoznawalnych budynków Budapesztu, a jego wysokość celowo odpowiada wysokości Bazyliki św. Stefana. Z tej strony Dunaju najlepiej widać relację kamienia, wody i ruchu mostów. Nie szukajcie idealnego kadru; szukajcie Waszego kadru.","mission":"W Waszej pocztówce znajdźcie jeden kolor. Wyszukajcie trzy odcienie tego koloru w kamieniu, wodzie lub niebie; jeden z nich stanie się kolorem soboty."},"s6":{"fact":"Most Małgorzaty łączy Budę, Peszt i Wyspę Małgorzaty, dlatego jego przebieg jest nietypowo rozgałęziony. Spacer po nim pozwala jednocześnie oglądać Parlament, zamek i wyspę. To dobre miejsce, by na chwilę wyjść z trybu zwiedzania.","mission":"Znajdźcie kolor soboty po obu stronach Dunaju. Gdy go odnajdziecie, idziecie dziesięć minut za rękę; bez planowania następnego kroku."},"s7":{"fact":"Powrót do Kalmára nie jest luką w planie, lecz logistycznym checkpointem. W Budapeszcie wieczorne przejazdy potrafią zająć więcej czasu, niż sugeruje mapa. Woda, przebranie i punktualne wyjście są dziś ważniejsze niż dokładanie kolejnego widoku.","mission":"Powiedzcie sobie: piątkowe słowo, detal z Gellérta i kolor soboty. To Wasza trzyczęściowa notatka przed Operą; o 17:30 kończycie przygotowania."},"s8":{"fact":"Węgierska Opera Państwowa jest jednym z najbardziej reprezentacyjnych budynków alei Andrássyego. Jej wnętrza powstały jako teatralne doświadczenie całościowe: od schodów i foyer po scenę. Przyjdźcie wcześniej, bo detale architektury są częścią wieczoru, a nie tylko tłem do spektaklu.","mission":"Każde wybiera jeden detal Opery. Jeden musi nawiązywać do znaku z Gellérta, drugi do linii z Zamku; po spektaklu zdradzacie sobie, który był który."},"s9":{"fact":"Szimpla i inne ruin bary narodziły się z wykorzystywania opuszczonych kamienic i podwórek dzielnicy żydowskiej. Ich siłą nie jest perfekcja, lecz mieszanka przedmiotów, ludzi i muzyki. To miejsce na spontaniczność, nie na realizację kolejnego obowiązku.","mission":"Pierwszy lokal wybiera Martynka, kolejny Bartek. Przy każdym wyborze powiedzcie, czy bliżej mu do Waszego słowa, koloru soboty czy detalu Opery."},"s10":{"fact":"Wielka Synagoga przy Dohány jest jedną z największych synagog na świecie i ważnym punktem historii żydowskiego Budapesztu. Jej fasada łączy inspiracje mauretańskie z miejską monumentalnością. Oglądajcie ją spokojnie od ulicy i pamiętajcie, że to czynne miejsce kultu.","mission":"Znajdźcie detal bardziej pałacowy niż sakralny. Porównajcie go z detalem Opery i zdecydujcie, który lepiej domyka sobotę."},"n1":{"fact":"Niedziela ma jeden twardy rytm: Parlament i wejście o ustalonej godzinie. Wszystkie wcześniejsze punkty mają dać Wam drogę, nie presję. Zostawcie zapas na zmianę pogody, zdjęcia i zwykłe spowolnienie miasta.","mission":"Każde bez patrzenia w zdjęcia wymienia jeden detal soboty. Jeśli oba są inne, tworzą dziś dwa tropy, które połączycie po zwiedzaniu Parlamentu."},"n2":{"fact":"Most Łańcuchowy był pierwszym stałym mostem łączącym Budę i Peszt i stał się symbolem zjednoczenia miasta. Lwy przy przyczółkach są jednym z jego najbardziej rozpoznawalnych motywów. Wybierzcie jednego z nich jako towarzysza najważniejszego punktu dnia.","mission":"Wasz lew jest dzisiejszym znakiem punktualności. Gdy go znajdziecie, sprawdzacie godzinę i od tej chwili nie dokładacie już żadnych nowych zadań przed Parlamentem."},"n3":{"fact":"Parlament nad Dunajem jest jednym z najważniejszych symboli węgierskiej państwowości i działa jednocześnie jako budynek polityczny oraz architektoniczna ikona miasta. Z bliska skala fasady jest zupełnie inna niż z budańskich punktów widokowych. Zwiedzanie wymaga czasu na kontrolę i wejście, dlatego ten punkt ma pierwszeństwo.","mission":"Tu nie ma dodatkowej misji. Przypomnijcie lwa z Mostu Łańcuchowego, weźcie oddech i trzymajcie się godziny 12:45."},"n4":{"fact":"Po intensywnym zwiedzaniu najcenniejsza jest przerwa, nie kolejny rekord odległości. Okolice Bazyliki pozwalają na spokojne odzyskanie energii i przegląd dnia. Traktujcie brunch jako moment na rozmowę, a nie jako przystanek techniczny.","mission":"Wybierzcie jedną rzecz spoza Waszych zwykłych zamówień. Nadajcie jej nazwę od jednego z sobotnich tropów: słowa, koloru albo detalu."},"n5":{"fact":"Bazylika św. Stefana i Parlament mają tę samą symboliczną wysokość, co jest świadomym gestem równowagi między państwem a wiarą. Fasada Bazyliki opiera się na osiowości i powtarzalnych detalach. Po dniu na wzgórzach to dobra okazja, by spojrzeć na Budapeszt od strony miejskiej symetrii.","mission":"Znajdźcie powtarzający się detal i zestawcie go z detalem Opery. Wybierzcie, który z nich lepiej opisuje Wasze piątkowe słowo."},"n6":{"fact":"Gulyás jest węgierską zupą o własnym charakterze, a nie prostym odpowiednikiem polskiego gulaszu. Po spacerze po Peszcie posiłek ma przywrócić energię, nie zabrać Wam całe popołudnie. Wybierajcie tempo zgodne z tym, co zostało z dnia.","mission":"Każde zamawia coś nowego. Przy pierwszych kilku kęsach nazwijcie jednym słowem najlepszy dotąd moment wyjazdu; to słowo dołączy do finału na lotnisku."},"n7":{"fact":"Dzielnica żydowska po zmroku zmienia rytm: w ciągu dnia jest pełna kawiarni i historii, wieczorem przejmuje ją życie uliczne. Nie potrzebujecie planu lokali, bo najciekawsze decyzje mogą wynikać z tego, co zobaczycie po drodze. Zostawcie miejsce na zwykłą rozmowę i odpoczynek.","mission":"Jeśli losujecie akcję, niech odwoła się do jednego z Waszych tropów. Najważniejsze: to dodatek do wieczoru, a nie warunek jego udania."},"n8":{"fact":"Powrót do Kalmára po trzech dniach jest dobrym momentem, by zauważyć, jak zmieniło się pierwsze wrażenie z Budy. To już nie punkt startowy, lecz baza pełna Waszych własnych skojarzeń. Nie próbujcie robić podsumowania idealnego; wybierzcie to, co zostało w pamięci samo.","mission":"Każde mówi jedno wspomnienie, którego nie chce zgubić. Połączcie je z piątkowym słowem i zostawcie sobie jedno pytanie na ostatni dzień."},"m1":{"fact":"Ostatni poranek nie powinien udawać pełnego dnia zwiedzania. Najlepszą pamiątką bywa spokojny spacer i poczucie, że nie trzeba już niczego nadrabiać. Bagaż, czas dojazdu i energia są dziś równie ważne jak atrakcje.","mission":"Wybierzcie wspólnie obraz, który byłby okładką całego wyjazdu. Niech zawiera przynajmniej jeden trop z Waszej gry: słowo, kolor, detal albo lwa."},"m2":{"fact":"Jaskinia Gellérta pozwala domknąć motyw wzgórza, od którego zaczęliście podróż. W Budapeszcie natura, sakralność i miejska infrastruktura często spotykają się w bardzo małej przestrzeni. To dobry punkt na ostatnie spokojne spojrzenie w stronę Budy.","mission":"Znajdźcie zaskakujący detal i porównajcie go z detalem z pierwszego wieczoru. Powiedzcie sobie, co zmieniło się w Waszym patrzeniu na miasto."},"m3":{"fact":"Zamek Vajdahunyad powstał jako architektoniczny kolaż stylów i dlatego wygląda jak zbiór różnych opowieści w jednym miejscu. Łączy odniesienia do romanizmu, gotyku, renesansu i baroku. To idealne miejsce, by na koniec potraktować miasto trochę jak scenografię filmu.","mission":"Wybierzcie fragment jak z filmu i nadajcie mu tytuł. Tytuł musi nawiązywać do piątkowego słowa lub do obrazu, który wybraliście jako okładkę wyjazdu."},"m4":{"fact":"Wielka Hala Targowa łączy codzienny rytm zakupów z turystyczną ciekawością miasta. Warto patrzeć na detale konstrukcji, kolory stoisk i tempo ludzi, zamiast od razu szukać pamiątki. Zostawcie sobie margines na dojazd do lotniska, nawet gdy hala wciągnie Was bardziej niż planowaliście.","mission":"Wybierzcie jedną małą rzecz oznaczoną w myślach jako Budapeszt 2026. Ma przypominać konkretną misję, a nie tylko miejsce, w którym została kupiona."},"m5":{"fact":"Lotnisko jest końcem trasy, ale nie musi kończyć historii, którą zbudowaliście przez cztery dni. Wszystkie tropy gry — słowo, detal, kolor, lew i obraz — są teraz Waszym prywatnym przewodnikiem po wyjeździe. Zostawcie sobie wystarczająco dużo czasu na formalności, żeby finał nie był pośpiechem.","mission":"Każde wybiera jedno wspomnienie, jedną misję i jeden pomysł na kolejny wspólny weekend. Na koniec powiedzcie jeszcze raz słowo z Kalmára: teraz znaczy już coś innego niż w piątek."}};D.flatMap(day=>day.p).forEach(point=>{if(GUIDE[point.id])Object.assign(point,GUIDE[point.id])});
const STORY_MISSIONS={"f1":"Wybierzcie jedno krótkie słowo na cały wyjazd. Nie zapisujcie go w telefonie: ma żyć w rozmowie i wracać, gdy coś Was zaskoczy.","f2":"Sprawdźcie, czy Wasze słowo nadal pasuje do tego, co widzicie. Bartek wybiera trzy elementy panoramy, Martynka jeden, który zabieracie dalej.","f3":"Wybierzcie jeden nieoczywisty detal i nazwijcie go znakiem pierwszego wieczoru. Od teraz szukacie jego krewnych, nie identycznych kopii.","f4":"Przed wejściem powiedzcie słowo i przypomnijcie znak z panoramy. Potem zróbcie pierwszą wspólną pauzę bez telefonów.","s1":"Rano wróćcie do słowa i znaku z piątku. Każde wybiera budynek, który pasuje do jednego z nich, ale nie mówi jeszcze dlaczego.","s2":"Zestawcie linię fasady z wczorajszym znakiem. Zauważcie, czy tworzą kontrast, czy raczej ten sam nastrój.","s3":"Każde wybiera detal, którego druga osoba jeszcze nie zauważyła. Zachowajcie go dla siebie przez kilka kolejnych kroków.","s4":"Ujawnijcie sobie dwa detale z poprzedniego punktu. Połączcie je w jedno zdjęcie i nadajcie mu tytuł od Waszego słowa.","s5":"W zdjęciu znajdźcie jeden kolor. Wyszukajcie jego trzy odmiany wokół siebie; jeden zostaje kolorem soboty.","s6":"Znajdźcie kolor soboty po obu stronach Dunaju. Jeśli wybierzecie spacer, idziecie przez dziesięć minut za rękę i bez ustalania następnego kroku.","s7":"Powiedzcie kolejno: słowo, znak i kolor. To Wasza mała mapa pamięci przed wieczorem; teraz priorytetem jest czas.","s8":"Każde wybiera detal, który rozwija jeden z Waszych wcześniejszych tropów. Po wydarzeniu zdradzacie sobie, co wybraliście i dlaczego.","s9":"Przy wyborze miejsca niech raz decyduje Martynka, potem Bartek. Za każdym razem powiedzcie, czy wybór pasuje bardziej do słowa, koloru czy znaku.","s10":"Znajdźcie detal o najbardziej pałacowym charakterze. Porównajcie go z detalem z wieczoru i wybierzcie ten, który lepiej domyka sobotę.","n1":"Każde bez patrzenia w zdjęcia przypomina jeden detal soboty. To dwa tropy niedzieli, które będziecie łączyć z nowymi wrażeniami.","n2":"Wybierzcie jednego lwa jako znak dzisiejszej punktualności. Od tej chwili jego zadaniem jest przypominać: ważne godziny są ważniejsze niż spontaniczne skręty.","n3":"Tu nie dokładacie żadnego zadania. Weźcie oddech, trzymajcie się ustalonej godziny i pozwólcie temu miejscu wybrzmieć bez pośpiechu.","n4":"Wybierzcie jedną rzecz spoza zwykłego zamówienia. Nadajcie jej nazwę od jednego z tropów, które już zebraliście.","n5":"Znajdźcie powtarzający się detal i porównajcie go z jednym z zapamiętanych detali soboty. Zdecydujcie, czy to kontynuacja, czy świadome przeciwieństwo.","n6":"Każde wybiera nowe danie. Przy pierwszych kęsach nazwijcie jednym słowem najlepszy dotąd moment wyjazdu; to słowo dołącza do finału.","n7":"Jeśli losujecie akcję, połączcie ją z jednym z Waszych tropów. Ma być dodatkiem do wieczoru, nie kolejnym obowiązkiem.","n8":"Każde mówi jedno wspomnienie, którego nie chce zgubić. Połączcie je z piątkowym słowem i zostawcie sobie jedno pytanie na ostatni dzień.","m1":"Wybierzcie wspólnie obraz, który mógłby być okładką całego wyjazdu. Musi zawierać przynajmniej jeden Wasz trop.","m2":"Znajdźcie zaskakujący detal i porównajcie go z pierwszym znakiem. Powiedzcie sobie, co zmieniło się w Waszym patrzeniu na miasto.","m3":"Wybierzcie fragment jak z filmu i nadajcie mu tytuł. Tytuł ma nawiązywać do słowa albo obrazu, który wybraliście na okładkę.","m4":"Wybierzcie jedną małą rzecz jako Budapeszt 2026. Ma przypominać konkretną misję, a nie tylko miejsce zakupu.","m5":"Każde wybiera jedno wspomnienie, jedną misję i pomysł na kolejny wspólny weekend. Na koniec wróćcie do słowa z początku: teraz znaczy już coś innego."};D.flatMap(day=>day.p).forEach(point=>{point.mission=STORY_MISSIONS[point.id]||point.mission;point.see=point.see+' '+point.fact;point.leg=point.leg.replace(/(→|↓)\s*[^·]+·/,'$1 następny punkt ·')});D.forEach(day=>{day.h=day.h.map(item=>item.replace(/·.*/,'· etap dnia'))});D[1].title='Sobota — rytm miasta';D[2].title='Niedziela — rytm dnia';
const A=[['💋','Buziak. Teraz. Bez negocjacji.'],['🤝','10 minut za rękę. Reszta świata poczeka.'],['👀','60 sekund bez telefonu. Patrzcie na siebie albo miasto.'],['🤫','5 minut ciszy. Idźcie obok siebie.'],['📸','Zróbcie zdjęcie, którego nie wolno oglądać do końca dnia.'],['💬','Powiedz drugiej osobie jedną rzecz, którą dziś zrobiła dobrze.'],['💃','30 sekund tańca. Tu, gdzie stoicie.'],['🚪','Znajdźcie najciekawsze drzwi w promieniu 100 metrów.'],['🐈','Znajdźcie kota. To teraz najważniejszy punkt.'],['🍺','Następny lokal wybiera osoba, która pierwsza zobaczy coś czerwonego.'],['🇭🇺','Zamówcie coś, czego żadne z Was nie umie wymówić.'],['🧭','Przez 300 metrów kierunek wybiera tylko jedna osoba.'],['❤️','Powiedzcie sobie: „Dobrze, że tu jesteśmy, bo…”'],['🔎','Znajdźcie detal, którego zwykły turysta może nie zauważyć.']];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Nie udało się zapisać postępu.');console.warn('Błąd zapisu postępu',e)}progress()}function complete(id){S.done[id]=true;save();render();requestAnimationFrame(()=>window.scrollTo({top:document.querySelector('.head').offsetTop-8,behavior:'smooth'}))}function undo(id){delete S.done[id];save();render();requestAnimationFrame(()=>window.scrollTo({top:document.querySelector('.head').offsetTop-8,behavior:'smooth'}))}function dayOK(i){return D[i].p.every(x=>S.done[x.id])}function go(i){if(i>0&&!dayOK(i-1)){toast('🔒 Najpierw 100% poprzedniego dnia.');return}active=i;render();window.scrollTo({top:document.querySelector('.tabs').offsetTop-5,behavior:'smooth'})}function toggle(id,k){document.getElementById(id+k).classList.toggle('open')}function mapsUrl(p){return 'https://maps.apple.com/?ll='+p.lat+','+p.lng+'&q='+encodeURIComponent(p.name)}function resetAll(){if(confirm('Wyzerować całą grę?')){localStorage.removeItem(KEY);location.reload()}}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',2200)}function weatherPlan(){const plans=[['Piątek: jeśli leje albo wieje, skróćcie część plenerową do jednego widoku. Przejdźcie wcześniej do ciepłego miejsca, a spacer traktujcie jako opcję po poprawie pogody.'],['Sobota: wybierajcie wnętrza, zadaszone przejścia i transport między punktami. Nie nadrabiajcie straconego czasu kosztem wieczornego terminu.'],['Niedziela: najważniejszy punkt dnia ma pierwszeństwo. W razie pogody skracacie wszystko przed nim, a późniejsze punkty wybieracie według energii.'],['Poniedziałek: pogoda nie może zjeść zapasu na lotnisko. Jeśli jest źle, skracacie spacer i wybieracie wcześniejszy przejazd.']];modal('<button class="close" onclick="closeM()">×</button><div class="ey">PLAN B</div><h2>☔ Pogoda ma plan, Wy też</h2><p style="font:18px/1.5 Georgia,serif">'+plans[active][0]+'</p><p>Nie zdradzamy kolejnych punktów: otwórzcie bieżącą kartę, podejmijcie decyzję i zachowajcie luz.</p>')}function chooseBridge(choice){S.choices=S.choices||{};S.choices.s6=choice;if(choice==='skip'){S.done.s6=true;save();render();toast('Pomijamy most — czas na spokojny powrót i ogarnięcie się.')}else{save();toast('Robicie spacer. Zaliczycie punkt, gdy będziecie gotowi.')}}function surprise(){let used=S.used||[],available=A.filter((_,i)=>!used.includes(i));if(!available.length){S.used=[];used=[];available=A.filter((_,i)=>!used.includes(i))}let realIndex=A.indexOf(available[Math.floor(Math.random()*available.length)]);S.used.push(realIndex);save();let a=A[realIndex];document.getElementById('modalbox').innerHTML='<button class="close" onclick="closeM()">×</button><div class="ey">BUDAPESZT MA DLA WAS ZADANIE</div><h2>'+a[0]+'</h2><p style="font:22px/1.4 Georgia,serif">'+a[1]+'</p>';document.getElementById('modal').classList.add('open')}function closeM(){document.getElementById('modal').classList.remove('open')}function progress(){let all=D.flatMap(x=>x.p),n=all.filter(x=>S.done[x.id]).length,p=Math.round(n/all.length*100);bar.style.width=p+'%';pct.textContent=p+'% wycieczki · '+n+'/'+all.length+' punktów'}
function render(){let x=D[active],idx=x.p.findIndex(p=>!S.done[p.id]);document.querySelectorAll('.tabs button').forEach((b,i)=>{b.classList.toggle('active',i===active);b.classList.toggle('lock',i>0&&!dayOK(i-1))});let h='<section class="head"><div class="ey">DZIEŃ '+(active+1)+'</div><h2>'+x.title+'</h2><p>'+x.date+'</p><div class="hint"><b>PLAN DNIA — TYLKO WSKAZÓWKI</b>'+x.h.map(v=>'<br>'+v).join('')+'</div></section>';if(idx<0)h+='<div class="lockedday"><h2>🎉 100% DNIA</h2><p>Następny rozdział jest odblokowany.</p></div>';else{if(idx>0){const prev=x.p[idx-1];h+='<button class="btn" type="button" onclick="undo(\''+prev.id+'\')">↶ Cofnij ostatni punkt</button>'}let p=x.p[idx];h+=card(p);if(p.id==='s6')h+='<section class="decision"><h3>🌉 Most Małgorzaty — decyzja</h3><p>Robicie spokojny spacer przez most, czy pomijacie go i idziecie od razu do Kalmára się ogarnąć?</p><div class="choice"><button type="button" onclick="chooseBridge(\'go\')">Idziemy przez most</button><button type="button" onclick="chooseBridge(\'skip\')">Pomijamy · Kalmár</button></div></section>'}if(D.flatMap(day=>day.p).every(point=>S.done[point.id]))h+='<section class="thanks"><h2>❤️ Dziękuję, Misiulku</h2><p>Za wspólną wycieczkę, wszystkie tropy, rozmowy i momenty, których nie dało się zaplanować.</p><p>Budapeszt zostaje z Wami. Następny wspólny weekend już czeka.</p></section>';main.innerHTML=h;progress()}function motifFor(id){if(['f4'].includes(id))return 'thermal';if(['s2','s3','m3'].includes(id))return 'gothic';if(['s4','s5','s6','n2','n3'].includes(id))return 'river';if(['s8','n5'].includes(id))return 'opera';if(['m4'].includes(id))return 'market';return 'gothic'}function card(p){return '<article class="stop motif-'+motifFor(p.id)+' '+(p.must?'must':'')+'"><span class="crest" aria-hidden="true"></span><div class="sh"><div class="ic">'+p.icon+'</div><div><h3>'+p.name+'</h3><div class="tag">'+p.tag+'</div></div></div><div class="when">🕰 '+p.time+'</div><div class="leg">'+p.leg+'</div><div class="grid"><button class="btn" onclick="toggle(\''+p.id+'\',\'s\')">◌ Odkrywamy</button><button class="btn" onclick="toggle(\''+p.id+'\',\'f\')">✦ Ciekawostka</button><button class="btn m" onclick="toggle(\''+p.id+'\',\'m\')">◆ Misja</button><a class="btn" href="'+mapsUrl(p)+'" target="_blank" rel="noopener noreferrer">⌁ Apple Maps</a></div><div class="ans" id="'+p.id+'s"><b>CO WIDZIMY?</b><br>'+p.see+'</div><div class="ans" id="'+p.id+'f"><b>CIEKAWOSTKA</b><br>'+p.fact+'</div><div class="ans" id="'+p.id+'m"><b>MISJA</b><br>'+p.mission+'</div><label class="done"><input type="checkbox" onchange="complete(\''+p.id+'\')"> Jesteśmy na miejscu — zalicz punkt</label></article>'}
const START_AT=new Date('2026-09-11T18:00:00+02:00').getTime();let gateTimer=null;function clock(ms){const s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;return(d?d+' dni ':'')+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}function initBriefMap(){const host=document.getElementById('briefmap');if(!host||!window.L)return;try{const map=L.map(host,{zoomControl:false,attributionControl:false,scrollWheelZoom:false,dragging:false,touchZoom:false,doubleClickZoom:false}).setView([47.4988,19.052],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);D.flatMap(day=>day.p).forEach(point=>L.circleMarker([point.lat,point.lng],{radius:6,color:'#fff',weight:2,fillColor:'#b56c45',fillOpacity:1,interactive:false}).addTo(map))}catch(e){host.innerHTML='<p>Mapa atrakcji będzie gotowa przy starcie gry.</p>'}}function showRules(){clearInterval(gateTimer);const gate=document.getElementById('gate');gate.hidden=false;gate.innerHTML='<div class="gatecard"><div class="ey">ZASADY GRY</div><h1>Wasza mapa<br>bez spoilerów</h1><p>Każda pinezka oznacza punkt wspólnej historii. Nazwy odkryjecie wyłącznie wtedy, gdy przyjdzie na nie czas.</p><div id="briefmap" aria-label="Mapa atrakcji bez podpisów"></div><ol class="rules"><li>Idziecie punkt po punkcie, ale możecie cofnąć ostatni, jeśli klikniecie go za szybko.</li><li>Misje budują jedną opowieść: słowo, znak, kolor, lew i obraz finałowy.</li><li>Plan B na pogodę jest zawsze pod ręką i nie zdradza kolejnych atrakcji.</li><li>Godziny oznaczone w planie mają pierwszeństwo przed spontanicznymi skrętami.</li></ol><button class="startgame" type="button" onclick="startGame()">▶ Zaczynamy grę miejską</button></div>';requestAnimationFrame(initBriefMap)}function showCountdown(){const gate=document.getElementById('gate');const paint=()=>{const remaining=START_AT-Date.now();if(remaining<=0){showRules();return}gate.hidden=false;gate.innerHTML='<div class="gatecard"><div class="ey">PIĄTEK · 11 WRZEŚNIA 2026</div><h1>Budapeszt,<br><em>na dwoje</em></h1><p>Gra odblokuje się dokładnie o 18:00 czasu Budapesztu. Do tego momentu miasto jeszcze czeka.</p><div class="count">'+clock(remaining)+'</div><p>Najpierw odliczanie. Potem mapa bez spoilerów. Dopiero później plan.</p><button class="startgame" type="button" onclick="showRules()">⚙️ Tryb roboczy — pomiń odliczanie</button></div>'};paint();gateTimer=setInterval(paint,1000)}function startGame(){clearInterval(gateTimer);document.getElementById('gate').hidden=true;const game=document.getElementById('game');game.hidden=false;game.classList.add('game-live');render()}function initGate(){if(Date.now()<START_AT)showCountdown();else showRules()}
initGate();if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Offline niedostępny',e)))};</script></body></html>
