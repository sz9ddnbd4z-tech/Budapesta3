<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173c36"><title>Budapeszt, na dwoje</title><style>html,body{margin:0;background:#f5efe3;color:#18322f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}#boot div{max-width:420px}#boot b{font-family:Georgia,serif;font-size:28px}#boot p{color:#716c62}</style></head><body><div id="boot"><div><b>Budapeszt,<br>na dwoje</b><p>Przygotowuję Wasz przewodnik…</p></div></div><script>
const MORE={
f1:{see:'Jesteście przy Kalmárze, na południowym zboczu Gellért-hegy. W tej części Budapesztu od razu czuć różnicę między pagórkowatą Budą a płaskim Pesztem po drugiej stronie Dunaju. Rozejrzyjcie się za zielenią, stromymi ulicami i widokiem na rzekę.',fact:'Gellért-hegy od wieków był strategicznym miejscem nad Dunajem. W średniowiecznej legendzie właśnie tutaj miał zginąć biskup Gellért, a wzgórze z czasem zaczęto nazywać jego imieniem. Co ciekawe, w XIX wieku na wzgórzu działało obserwatorium astronomiczne, zanim powstała Citadella.'},
f2:{see:'Citadella siedzi na szczycie wzgórza jak ogromny kamienny punkt obserwacyjny. Spójrzcie najpierw na Dunaj, potem powoli przesuńcie wzrok wzdłuż obu brzegów. Przy dobrej widoczności zobaczycie kilka mostów i dużą część centrum miasta.',fact:'Citadellę zbudowano po klęsce węgierskiej rewolucji 1848–49 z inicjatywy władz Habsburgów. Miała nie tylko znaczenie wojskowe — jej położenie pozwalało kontrolować zarówno Budę, jak i Peszt. Dziś miejsce, które miało budzić respekt i strach, jest jednym z najlepszych punktów widokowych miasta. citeturn0search0'},
f3:{see:'Góra Gellerta jest właściwie wielkim naturalnym balkonem nad Dunajem. Zatrzymajcie się na chwilę i zamiast szukać kolejnego zabytku popatrzcie na zwykłe życie poniżej: dachy, tramwaje, samochody i ludzi przecinających mosty.',fact:'Wzgórze ma około 235 m wysokości, a jego nazwa pochodzi od św. Gellérta. Według średniowiecznej legendy biskup został zrzucony ze zbocza podczas pogańskiego powstania w 1046 roku. Jeszcze wcześniej wzgórze miało inne nazwy, a w czasach osmańskich kojarzono je również z muzułmańskim świętym Gürz Eliasem. citeturn0search36'},
f4:{see:'Rudas po zmroku jest zupełnie innym doświadczeniem niż zwykły basen. Zobaczycie charakterystyczną kopułę tureckiego łaźniowego wnętrza, kamień, parę i wodę oświetloną punktowym światłem. Najlepiej zwolnić tempo — to jest miejsce, w którym niczego nie trzeba „zwiedzać”.',fact:'Rudas ma historię sięgającą czasów osmańskich, a jego najbardziej charakterystyczna część zachowała układ tureckiej łaźni. Tradycja budapeszteńskich kąpieli termalnych jest związana z geologią miasta: pod Budapesztem znajdują się liczne źródła termalne, dlatego kąpiele są tu częścią miejskiej kultury, a nie tylko atrakcją turystyczną.'},
s1:{see:'Startujecie z Kalmára i kierujecie się w stronę wzgórz Buda. Zauważcie, jak szybko zmienia się zabudowa: szerokie reprezentacyjne przestrzenie ustępują uliczkom, zboczom i spokojniejszym fragmentom miasta.',fact:'Budapeszt powstał z połączenia historycznych miast Buda, Óbuda i Pest w 1873 roku. Dunaj nie jest więc tylko rzeką przecinającą centrum — przez stulecia był granicą między różnymi częściami miasta i jednym z powodów, dla których właśnie tutaj rozwinęła się metropolia.'},
s2:{see:'Na Wzgórzu Zamkowym patrzcie nie tylko na wielkie budynki. Zwróćcie uwagę na mury, poziomy ulic, bramy i widoki pojawiające się między budynkami. To miejsce jest bardziej miastem na wzgórzu niż pojedynczą atrakcją.',fact:'Dzisiejszy Zamek Królewski jest w dużej mierze rezultatem odbudowy po ogromnych zniszczeniach II wojny światowej. Podczas odbudowy pojawił się spór: odtwarzać barokową rezydencję czy eksponować średniowieczne warstwy wzgórza. Dlatego spacer po dzielnicy jest trochę jak oglądanie kilku epok naraz.'},
s3:{see:'Kościół Macieja wyróżnia się przede wszystkim dachem. Kolorowe wzory tworzą z daleka coś niemal graficznego, a z bliska widać mnóstwo drobnych rytmów i ornamentów. Zajrzyjcie też na wieżę i fasadę — warto popatrzeć w górę.',fact:'Kościół ma średniowieczne korzenie, ale jego obecny wygląd jest wynikiem wielu przebudów i XIX-wiecznej restauracji. Charakterystyczne dachówki są związane z manufakturą Zsolnay z Pécs, słynną z kolorowej ceramiki architektonicznej. Świątynia była także miejscem koronacji królewskich.'},
s4:{see:'Z Batthyány tér Parlament ogląda się niemal jak scenografię ustawioną po drugiej stronie Dunaju. Stańcie możliwie blisko rzeki i zobaczcie, jak budynek odbija się w wodzie. Szczególnie ciekawa jest symetria: środek Parlamentu prowadzi wzrok dokładnie w stronę miasta.',fact:'Plac jest jednym z klasycznych punktów widokowych na Parlament. Sama nazwa Batthyány upamiętnia Lajosa Batthyányego, pierwszego premiera Węgier podczas rewolucji 1848 roku. Po drugiej stronie rzeki widać także wzgórze zamkowe i charakterystyczne linie Budy.'},
s5:{see:'Tutaj zatrzymajcie się na chwilę dłużej. Parlament najlepiej oglądać nie tylko jako ogromny budynek, ale jako kompozycję kopuły, wieżyczek, schodów i fasady odbijającej się w Dunaju. Spróbujcie znaleźć miejsce, z którego całość wygląda najbardziej symetrycznie.',fact:'Parlament ma 96 metrów wysokości — tyle samo co Bazylika św. Stefana. Liczba 96 ma symboliczne znaczenie: odnosi się do roku 896, tradycyjnie przyjmowanego jako moment przybycia Węgrów do Kotliny Karpackiej. Budynek powstawał w latach 1885–1904 i był częścią wielkiego programu budowania nowoczesnej stolicy.'},
s6:{see:'Most Małgorzaty jest dobrym miejscem na zmianę tempa. Zamiast iść prosto do celu, popatrzcie w obie strony: na wzgórza Budy, Parlament, wyspę i nurt Dunaju. Most daje rzadką perspektywę, z której miasto wygląda jak jeden długi obraz.',fact:'Most został otwarty w 1876 roku i jest drugim najstarszym zachowanym mostem Budapesztu. Jego charakterystyczny układ pozwala zjechać również na Wyspę Małgorzaty. Wyspa przez wieki była miejscem klasztorów i odosobnienia, a dziś jest jednym z ulubionych terenów rekreacyjnych mieszkańców.'},
s7:{see:'Wracacie do Kalmára na szybki reset. To moment techniczny: prysznic, przebranie, woda i wyjście bez przeciągania. Zanim ruszycie, sprawdźcie tylko najważniejszą rzecz — bilety i godzinę spektaklu.',fact:'W XIX wieku wyjście do opery było wydarzeniem społecznym, a nie tylko wieczorną rozrywką. W Budapeszcie szerokie schody Opery pozwalały publiczności prezentować stroje i spotykać się przed przedstawieniem. Dlatego nie traktujcie wejścia jak zwykłego „wejścia do teatru” — warto dać sobie chwilę na obejrzenie wnętrza.'},
s8:{see:'Opera jest jednym z tych miejsc, gdzie warto podnieść wzrok. Złocenia, freski, loże, schody i żyrandol tworzą wnętrze dużo bardziej teatralne niż sama scena. Przyjdźcie wcześniej i poświęćcie kilka minut na spokojne obejrzenie budynku, zanim zacznie się spektakl.',fact:'Węgierska Opera Państwowa została otwarta w 1884 roku według projektu Miklósa Ybla. W jej historii pojawia się również Gustav Mahler, który był dyrektorem artystycznym w latach 1888–1891. Główna sala mieści około tysiąca widzów, a ogromny żyrandol waży ponad trzy tony. citeturn2search0turn2search1'},
s9:{see:'Szimpla nie wygląda jak klasyczny elegancki lokal — i właśnie o to chodzi. Stare wnętrza, przypadkowe meble, graffiti, rośliny, lampy i przedmioty z drugiego życia tworzą kontrolowany chaos. Nie próbujcie wszystkiego obejrzeć; znajdźcie po prostu jeden absurdalny detal.',fact:'Kultura ruin barów rozwinęła się w starej VII dzielnicy, gdzie opuszczone i zaniedbane budynki zaczęto wykorzystywać jako miejsca spotkań. Szimpla Kert stała się jednym z najbardziej znanych symboli tego ruchu. To dobry przykład tego, jak miejska degradacja może zostać przekształcona w nowy styl kultury.'},
s10:{see:'Synagogę zobaczcie również z pewnej odległości — wtedy najlepiej widać jej dwie wieże, rytm okien i orientalizujące detale. Nawet jeśli nie wchodzicie do środka, fasada opowiada sporo o XIX-wiecznym Budapeszcie.',fact:'Wielka Synagoga przy Dohány powstała w latach 1854–1859 i reprezentuje nurt zwany stylem mauretańskim. Jej architekt Ludwig Förster świadomie wykorzystał formy kojarzone z północną Afryką i średniowieczną Hiszpanią. Kompleks jest związany także z historią budapeszteńskiego getta podczas II wojny światowej. citeturn2search3'},
n1:{see:'Z Kalmára ruszacie w stronę Dunaju i stopniowo zbliżacie się do najbardziej reprezentacyjnej części centrum. Zwróćcie uwagę, jak wzgórza Budy powoli ustępują szerokiemu widokowi na rzekę.',fact:'Budapeszt jest miastem, w którym geografia bardzo mocno wpłynęła na historię. Dunaj dawał możliwość handlu i komunikacji, a wzgórza Budy zapewniały naturalną ochronę. Już Celtowie osiedlali się w okolicy Gellért-hegy kilka wieków przed naszą erą. citeturn0search7'},
n2:{see:'Most Łańcuchowy najlepiej oglądać również z poziomu konstrukcji. Zobaczcie masywne kamienne lwy, stalowe elementy i powtarzalność łańcuchów. W połowie mostu zatrzymajcie się i spójrzcie w dół — Dunaj nagle staje się głównym bohaterem.',fact:'Széchenyi Chain Bridge otwarto w 1849 roku jako pierwszą stałą przeprawę przez Dunaj w tym miejscu. Zaprojektował go angielski inżynier William Tierney Clark, a budową kierował Szkot Adam Clark. Most był w XIX wieku symbolem nowoczesności i jednym z projektów, które pomogły zbliżyć do siebie Budę i Peszt. citeturn1search0'},
n3:{see:'Parlament oglądacie najpierw z zewnątrz, ale najważniejszy jest dzisiaj moment wejścia. O 12:00 macie być już na miejscu, żeby spokojnie przejść kontrolę i nie zamienić zwiedzania w sprint.',fact:'Budynek Parlamentu powstawał w czasie wielkiego rozwoju Budapesztu po zjednoczeniu miasta. Jego neogotycka fasada jest ogromna, ale we wnętrzu znajdziecie także elementy renesansowe i barokowe. Kopuła i układ budynku są częścią świadomie stworzonej symboliki państwowej.'},
n4:{see:'Po Parlamencie pora zejść z obrotów. W brunchowni zwróćcie uwagę nie tylko na jedzenie, ale też na sposób, w jaki Budapeszt łączy kawę, słodkie wypieki i długie siedzenie przy stole. Zamówcie coś trochę bardziej ryzykownego niż zwykle.',fact:'Węgierska kultura kawiarni ma długą historię, a Budapeszt był na przełomie XIX i XX wieku miastem pełnym kawiarni literackich. Węgrzy mają też ogromną tradycję cukierniczą: tort Dobosa, rétes czy kremowe ciastka są częścią miejskiego dziedzictwa kulinarnego.'},
n5:{see:'Bazylika św. Stefana dominuje nad placem przede wszystkim skalą. Podejdźcie bliżej, ale potem cofnijcie się kilka kroków — dopiero wtedy proporcje kopuły i fasady zaczynają być naprawdę czytelne.',fact:'Bazylika ma 96 metrów wysokości, czyli tyle samo co Parlament. W Budapeszcie nie jest to przypadek: oba budynki symbolicznie równoważą władzę świecką i religijną. Świątynia nosi imię Stefana I, pierwszego koronowanego króla Węgier i jednej z najważniejszych postaci w historii państwa.'},
n6:{see:'To jest moment na prawdziwie węgierski obiad. Jeśli widzicie gulyás, pörkölt, paprikás albo coś z nokedli, macie właśnie kilka klasycznych tropów. Najlepiej zamówić jedną rzecz znaną i jedną taką, której nazwa nic Wam nie mówi.',fact:'Gulyás pierwotnie był jedzeniem pasterzy bydła; sama nazwa gulyás oznacza pasterza. Dawne wersje mięsa przygotowywane przez pasterzy można było suszyć i przechowywać, a potem odtwarzać wodą. Papryka pojawiła się w kuchni węgierskiej dopiero po sprowadzeniu jej do Europy i z czasem stała się jednym z jej najbardziej charakterystycznych smaków. citeturn0search34turn0search37'},
n7:{see:'Wieczorem dzielnica wygląda zupełnie inaczej niż za dnia. Nie musicie wybierać najlepszego baru — wystarczy wejść tam, gdzie coś Was zaciekawi: muzyka, światło, tłum albo dziwny szyld.',fact:'VII dzielnica była historycznym centrum żydowskiego życia Pesztu. Dziś część tej przestrzeni słynie z ruin barów, klubów i małych lokali, ale za współczesną atmosferą kryje się bardzo trudna historia XX wieku. Warto więc patrzeć na tę dzielnicę jednocześnie jako na centrum nocnego życia i miejsce pamięci.'},
n8:{see:'Kalmár jest dzisiaj metą, nie kolejnym punktem do zaliczenia. Usiądźcie na chwilę, odłóżcie telefony i pozwólcie, żeby dzień zakończył się bez kolejnego „musimy jeszcze zobaczyć”.',fact:'Budapeszt najlepiej zapamiętuje się nie jako listę zabytków, tylko jako zestaw powtarzających się obrazów: Dunaj, wzgórza, mosty, kąpiele termalne, kawiarnie i wieczorne ulice. To właśnie z takich drobnych scen składa się pamięć o mieście.'},
m1:{see:'Ostatni dzień zaczyna się blisko miejsca, które znacie już z pierwszego wieczoru. Zostawcie bagaż, sprawdźcie godzinę wyjazdu i ruszcie bez ambicji na wielkie zwiedzanie.',fact:'Gellért-hegy jest jednym z miejsc, które pokazują, jak blisko siebie w Budapeszcie znajdują się natura, geologia i historia miasta. Wzgórze jest częścią obszaru wpisanego na listę UNESCO razem z brzegami Dunaju i dzielnicą zamkową.'},
m2:{see:'Jaskinia przy Gellért-hegy wygląda jak naturalny element skały, ale jej historia została mocno związana z człowiekiem. Zwróćcie uwagę na relację między kamieniem, wejściem i kościołem wykutym w zboczu.',fact:'Jaskinie Gellért-hegy powstały w związku z procesami geologicznymi i działalnością dawnych źródeł termalnych. Sama nazwa wzgórza przez wieki zmieniała się, a w jego historii pojawiają się zarówno legendy chrześcijańskie, jak i ślady okresu osmańskiego. citeturn0search36'},
m3:{see:'Vajdahunyad wygląda jak zamek z bajki, ale przy bliższym spojrzeniu zaczyna być podejrzanie różnorodny. Zobaczycie obok siebie motywy romańskie, gotyckie, renesansowe i barokowe — wybierzcie ten fragment, który najbardziej wygląda jak prawdziwa średniowieczna twierdza.',fact:'Kompleks powstał w związku z wystawą milenijną upamiętniającą tysiąclecie przybycia Węgrów do Kotliny Karpackiej. Początkowo konstrukcja była wystawową makietą z nietrwałych materiałów, ale spodobała się mieszkańcom tak bardzo, że zbudowano ją później na stałe.'},
m4:{see:'Wielka Hala Targowa to dobry finał, bo miasto można tutaj „spróbować”. Na dole jest gwar, zapach jedzenia i stoiska, a wyżej znajdziecie pamiątki i produkty, które łatwo zabrać do domu.',fact:'Central Market Hall otwarto 15 lutego 1897 roku. Budynek zaprojektował Samu Pecz, a jego konstrukcja ma około 10 000 m² powierzchni. Charakterystyczny dach ozdobiono kolorową ceramiką Zsolnay z Pécs — tej samej marki, której ślady widzieliście wcześniej na Kościele Macieja. citeturn2search2'},
m5:{see:'Tu już nie ma kolejnego zadania. Macie być na lotnisku z zapasem, więc potraktujcie tę chwilę jako oficjalne zakończenie gry. Ostatnie spojrzenie, ostatnie zdjęcie i możecie wracać do Polski.',fact:'Wasza trasa kończy się dokładnie tak, jak zaczęła — od wspólnego przejścia przez miasto. Zamiast próbować zapamiętać wszystkie daty, wybierzcie trzy obrazy, które zostaną z Wami po Budapeszcie: jeden widok, jeden smak i jeden moment tylko dla Was.'}
};
async function boot(){
 try{if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();for(const k of await caches.keys())await caches.delete(k)}}catch(e){}
 const html=await fetch('./app-v5.html?fresh='+Date.now(),{cache:'no-store'}).then(r=>r.text());
 const d=new DOMParser().parseFromString(html,'text/html');
 document.title=d.title||'Budapeszt, na dwoje';
 document.head.innerHTML=d.head.innerHTML;
 document.body.innerHTML=d.body.innerHTML;
 const scripts=[...d.scripts].map(s=>s.textContent).filter(Boolean);
 for(const code of scripts){const s=document.createElement('script');s.textContent=code;document.body.appendChild(s)}
 const apply=()=>{for(const [id,v] of Object.entries(MORE)){const a=document.getElementById(id+'v'),b=document.getElementById(id+'f');if(a){a.innerHTML='<b>CO WIDZIMY?</b><br>'+v.see}if(b){b.innerHTML='<b>CIEKAWOSTKA</b><br>'+v.fact}}};
 apply();new MutationObserver(apply).observe(document.body,{childList:true,subtree:true});
}
boot().catch(e=>{document.getElementById('boot').innerHTML='<div><b>Nie udało się uruchomić przewodnika.</b><p>Spróbuj odświeżyć stronę. Jeśli problem zostanie, naprawię go po stronie aplikacji.</p></div>'});
</script></body></html>
